# =============================================================================
# The nightly copy of the school.
#
# WHY THIS RUNS HERE AND NOT ON VERCEL
#
# The obvious place for this is a Vercel cron, next to every other scheduled
# job in the app. It is the wrong place. A Vercel function is capped at 60
# seconds on this plan and its response body at 4.5MB, and a pg_dump grows
# with the school — so a backup written there works perfectly in testing, works
# for the first year, and then starts failing silently somewhere around the
# student intake that pushes it past the limit. The failure mode of a backup
# is the one thing that must not be size-dependent.
#
# GitHub Actions is free for this, gets six hours, keeps its own secrets, and
# above all lives in a different account from both Neon and Cloudflare. That
# last point is the entire design: a backup that shares an account with the
# thing it backs up dies in the same email compromise, the same declined card,
# the same suspension.
#
# -----------------------------------------------------------------------------
# WHY THIS FILE WAS REWRITTEN (2026-08-09)
# -----------------------------------------------------------------------------
# It had run every night since 3 August and failed every night, in seventeen
# seconds, and nobody found out. Three separate faults, each of which is the
# kind that only shows up in the incident it ruins:
#
#  1. NONE of the secrets were ever set. restic exited with "Please specify
#     repository location" and the log said nothing about which secret was
#     missing, so the failure looked like a tooling problem rather than a
#     ten-minute configuration job.
#
#  2. The step that reports failure to the app ALSO failed, because it needs
#     APP_BASE_URL and CRON_SECRET, which were equally unset. So the one
#     mechanism designed to notice a silent backup failure was itself silently
#     failing. The staleness alarm never fired because it never heard anything
#     at all — which is exactly the shape of the disaster backup-health.ts was
#     written to prevent, achieved by a different route.
#
#  3. The dump was rejected if it came in under a megabyte. This school's dump
#     is a fraction of that. So even fully configured, the workflow would have
#     thrown away its own good backup and called it a failure. A size floor is
#     a guess about how big the data ought to be; the check is now a content
#     check, which is true at any size.
#
# It now degrades instead of collapsing. With no object-storage secrets at all
# it still takes the dump, encrypts it, and keeps it as a GitHub artifact —
# which is a different account from Neon, and therefore still satisfies the
# point of the whole design. Restic remains the destination worth configuring,
# and the log says so every run until it is.
#
# WHAT IT PRODUCES
#
# Preferred: an encrypted, deduplicated restic snapshot in an S3-compatible
# bucket at a DIFFERENT VENDOR from Cloudflare R2 — Backblaze B2 is the cheap
# default, and Cloudflare R2 itself is acceptable for the DATABASE dump since
# the database lives at Neon. restic encrypts client-side with RESTIC_PASSWORD,
# so the storage provider holds ciphertext and nothing else. That is not
# paranoia: these dumps contain passport scans, home addresses and payment
# records, and a leaked bucket key must not be the same event as a leaked
# student database.
#
# Fallback: the same dump, encrypted with AES-256 under BACKUP_PASSPHRASE and
# retained as a workflow artifact for 90 days.
# =============================================================================

name: Backup database

on:
  schedule:
    # 01:30 UTC — 02:30 in Lagos, the quietest hour for a Nigerian school.
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  # Two dumps at once would both succeed and waste a Neon compute hour racing.
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}

    steps:
      # -----------------------------------------------------------------------
      # Say what is missing, by name, before doing anything else.
      #
      # The old failure was a restic error message about a flag nobody had been
      # asked to pass. Naming the secret turns a puzzle into an errand.
      # -----------------------------------------------------------------------
      - name: Check the configuration
        id: config
        run: |
          set -euo pipefail

          missing=""
          [ -n "${{ secrets.DIRECT_DATABASE_URL }}" ] || missing="$missing DIRECT_DATABASE_URL"

          if [ -n "$missing" ]; then
            echo "::error::Cannot back up. Missing repository secret(s):$missing"
            echo "Set them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

          if [ -n "${RESTIC_REPOSITORY:-}" ] && [ -n "${RESTIC_PASSWORD:-}" ]; then
            echo "destination=restic" >> "$GITHUB_OUTPUT"
          else
            echo "destination=artifact" >> "$GITHUB_OUTPUT"
            echo "::warning::RESTIC_REPOSITORY/RESTIC_PASSWORD are not set. Falling back to an encrypted workflow artifact, retained 90 days. This is a stopgap: artifacts expire, cannot be pruned to a retention policy, and are capped in size. See docs/SECURITY.md for the twenty-minute setup."
          fi

          if [ -z "${{ secrets.BACKUP_PASSPHRASE }}" ] && [ -z "${RESTIC_PASSWORD:-}" ]; then
            echo "::error::Neither RESTIC_PASSWORD nor BACKUP_PASSPHRASE is set. Refusing to write an unencrypted copy of a database containing passport scans and payment records."
            exit 1
          fi

          if [ -z "${{ secrets.APP_BASE_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::warning::APP_BASE_URL/CRON_SECRET are not set, so the app cannot be told this ran. The staleness alarm in /admin/security will keep reporting that no backup has ever succeeded — which, from the app's point of view, is the truth."
          fi

      - name: Install pg_dump and restic
        run: |
          set -euo pipefail
          # PGDG rather than Ubuntu's default, because pg_dump refuses to dump
          # a server newer than itself and Neon upgrades its Postgres without
          # asking. Pinning to the newest client avoids a backup that stops
          # working on a morning nobody touched this file.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          # Update ONLY the pgdg list and fail loudly if that repo is
          # unreachable — the old version let an apt-get update warning slide
          # and silently fell back to the runner's preinstalled client 16,
          # which then refused Neon (now on PG 18) with a version mismatch.
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist="sources.list.d/pgdg.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          # Neon runs Postgres 18. pg_dump refuses to dump a server newer than
          # itself, so track Neon's major here. On the next Neon major bump this
          # number changes and the assertion below is what makes that obvious.
          sudo apt-get install -y --no-install-recommends postgresql-client-18 restic
          pg_dump --version
          restic version

          # pg_wrapper picks the highest installed client, but if -18 somehow
          # did not land we must not proceed to produce a dump that silently
          # disagrees with itself.
          PGDUMP_MAJOR="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          if [ "${PGDUMP_MAJOR:-0}" -lt 18 ]; then
            echo "::error::pg_dump is v${PGDUMP_MAJOR}, need >= 18 to dump this Neon server. The PGDG install did not take."
            exit 1
          fi

      - name: Dump
        id: dump
        run: |
          set -euo pipefail

          # The DIRECT string, not the pooled one. A pooler in transaction mode
          # cannot hold the consistent snapshot a dump needs, and the failure is
          # not an error — it is a dump that silently disagrees with itself
          # across tables, which is worse than no dump at all.
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          FILE="easyway-${STAMP}.dump"

          pg_dump \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file="$FILE" \
            "${{ secrets.DIRECT_DATABASE_URL }}"

          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$(stat -c%s "$FILE")" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # A CONTENT check, not a size floor.
      #
      # The previous version refused any dump under a megabyte, on the theory
      # that a tiny dump means something went wrong. It is a reasonable theory
      # and it was wrong here: this school's dump is well under that, so the
      # check would have discarded every good backup it was given. Worse, the
      # threshold would have needed revisiting every time the school grew,
      # which is precisely the size-dependent failure the header warns about.
      #
      # Asking pg_restore what is actually inside answers the real question —
      # "did we dump the whole database or an empty schema" — and the answer
      # does not change with the school's size.
      # -----------------------------------------------------------------------
      - name: Verify the dump has the school in it
        run: |
          set -euo pipefail
          FILE="${{ steps.dump.outputs.file }}"

          pg_restore --list "$FILE" > toc.txt

          TABLES="$(grep -c 'TABLE DATA' toc.txt || true)"
          echo "Tables with data in the dump: ${TABLES}"

          # Forty-odd tables carry rows in this schema. Twenty is a floor that
          # cannot be reached by an empty database, a wrong connection string or
          # a permissions failure, and cannot be tripped by a quiet term.
          if [ "${TABLES:-0}" -lt 20 ]; then
            echo "::error::The dump contains only ${TABLES} tables with data. That is not this database — check DIRECT_DATABASE_URL."
            exit 1
          fi

          for required in Student Payment User Grade Attendance; do
            grep -q "TABLE DATA public \"\?${required}\"\?" toc.txt \
              || grep -q "TABLE DATA public ${required} " toc.txt \
              || { echo "::error::No ${required} data in the dump."; exit 1; }
          done

      - name: Store — restic
        if: steps.config.outputs.destination == 'restic'
        id: restic
        run: |
          set -euo pipefail
          restic snapshots > /dev/null 2>&1 || restic init

          restic backup \
            --tag database \
            --tag "easyway" \
            --host easyway-lms \
            "${{ steps.dump.outputs.file }}" \
            --json | tee restic-out.json

          SNAPSHOT="$(grep -o '"snapshot_id":"[^"]*"' restic-out.json | tail -1 | cut -d'"' -f4)"
          echo "snapshot_id=${SNAPSHOT}" >> "$GITHUB_OUTPUT"

          # Fourteen dailies covers "we noticed within a fortnight", which is
          # the realistic detection time for a quiet data problem. The monthlies
          # exist for the other kind of question — what did this student's
          # record say in March — which is the one auditors and disputes ask.
          restic forget \
            --tag database \
            --keep-daily 14 \
            --keep-weekly 8 \
            --keep-monthly 12 \
            --prune

          # Reads 5% of the actual data rather than just the metadata. A repo
          # that lists snapshots happily can still hold corrupt packs, and the
          # moment to find that out is not during a restore.
          restic check --read-data-subset=5%

      - name: Store — encrypted artifact
        if: steps.config.outputs.destination == 'artifact'
        run: |
          set -euo pipefail
          # AES-256 with a key derived by PBKDF2, so the artifact GitHub keeps
          # is ciphertext. Decrypt with:
          #   openssl enc -d -aes-256-cbc -pbkdf2 -in <file>.enc -out <file>
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "${{ steps.dump.outputs.file }}" \
            -out "${{ steps.dump.outputs.file }}.enc" \
            -pass pass:"${{ secrets.BACKUP_PASSPHRASE }}"
          rm -f "${{ steps.dump.outputs.file }}"

      - name: Keep the artifact
        if: steps.config.outputs.destination == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: "*.dump.enc"
          retention-days: 90
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # Tell the app — and never let this step be the reason a good backup is
      # recorded as a failure.
      #
      # The old version had no `|| true`, so a curl to an unset APP_BASE_URL
      # exited 3 and marked the whole run failed. That inverted the meaning of
      # the only signal anybody watches.
      # -----------------------------------------------------------------------
      - name: Tell the app
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail

          if [ -z "${{ secrets.APP_BASE_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "APP_BASE_URL/CRON_SECRET not set — skipping the check-in."
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            PAYLOAD=$(printf '{"kind":"database","status":"success","snapshotId":"%s","sizeBytes":%s,"detail":{"destination":"%s"}}' \
              "${{ steps.restic.outputs.snapshot_id }}" \
              "${{ steps.dump.outputs.size_bytes }}" \
              "${{ steps.config.outputs.destination }}")
          else
            PAYLOAD=$(printf '{"kind":"database","status":"failed","error":"Workflow run %s failed — see the Actions log."}' \
              "${{ github.run_id }}")
          fi

          curl -fsS -X POST "${{ secrets.APP_BASE_URL }}/api/backup/report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "::warning::Could not reach the app to record this run."
