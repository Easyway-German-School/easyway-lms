# =============================================================================
# Proving the backups are real.
#
# A backup nobody has restored is a rumour. This is the step almost every team
# skips, and skipping it is how organisations discover — on the worst day they
# will have — that the dumps have been zero bytes since February, or that the
# passphrase in the password manager is the old one, or that pg_restore refuses
# the file because of an extension nobody remembers enabling.
#
# Once a month this takes the newest database backup, restores it into a
# throwaway Postgres, counts every table, and compares those counts against the
# live database. If the restore does not work, it fails loudly while there is
# still a working system to fix it from — the only useful time to find out.
#
# It reads the SAME artifact that backup-database.yml produces: an encrypted
# `*.dump.enc` kept as a GitHub Actions artifact (AES-256-CBC / PBKDF2 under
# BACKUP_PASSPHRASE). If that workflow is ever upgraded to a restic repository,
# swap the "Fetch" step for a `restic restore latest`.
#
# The scratch database is a service container, so the drill needs no second
# database anywhere and cannot possibly write to production. The only thing it
# touches outside itself is a read-only COUNT against production.
# =============================================================================

name: Restore drill

on:
  schedule:
    # 03:00 UTC on the 3rd — a weekday-ish date, far from month-end reporting.
    - cron: "0 3 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      scratch:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SCRATCH_URL: postgresql://postgres:drill@localhost:5432/drill

    steps:
      - name: Install tooling
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # /usr/bin/pg_restore stays pinned to the runner's preinstalled
          # client 16 even with 18 installed; call the versioned binary.
          echo "PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"

      - name: Fetch and decrypt the newest backup artifact
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.BACKUP_PASSPHRASE }}" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set — cannot decrypt the backup artifact."
            exit 1
          fi

          # Newest unexpired artifact whose name starts with `database-backup-`.
          # The API returns artifacts newest-first; 100 covers well over a month.
          META="$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[]
                   | select(.name | startswith("database-backup-"))
                   | select(.expired == false)]
                  | sort_by(.created_at) | reverse | .[0]
                  | "\(.id)\t\(.name)\t\(.created_at)"')"

          if [ -z "$META" ] || [ "$META" = "null" ]; then
            echo "::error::No unexpired database-backup-* artifact. Has 'Backup database' succeeded in the last 90 days?"
            exit 1
          fi

          ART_ID="$(echo "$META" | cut -f1)"
          ART_NAME="$(echo "$META" | cut -f2)"
          ART_WHEN="$(echo "$META" | cut -f3)"
          echo "Using artifact ${ART_NAME} (id ${ART_ID}), created ${ART_WHEN}"

          # Freshness: a backup older than 48h means the nightly job is broken.
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$ART_WHEN" +%s) ) / 86400 ))
          if [ "$AGE_DAYS" -gt 2 ]; then
            echo "::error::Newest backup is ${AGE_DAYS} days old — the backup job is not running."
            exit 1
          fi

          gh api "repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip" > artifact.zip
          unzip -o artifact.zip -d enc
          ENC="$(find enc -name '*.dump.enc' | head -1)"
          if [ -z "$ENC" ]; then
            echo "::error::Artifact ${ART_NAME} contains no *.dump.enc file."
            exit 1
          fi

          mkdir -p restored
          DUMP="restored/$(basename "${ENC%.enc}")"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$ENC" -out "$DUMP" \
            -pass pass:"${{ secrets.BACKUP_PASSPHRASE }}"

          # The dump must at least be a readable custom-format archive.
          "$PG_BIN/pg_restore" --list "$DUMP" > /dev/null

          echo "dump=${DUMP}" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=${ART_NAME}" >> "$GITHUB_OUTPUT"

      - name: Restore it into the scratch database
        run: |
          set -euo pipefail
          # --no-owner / --no-privileges because the roles Neon uses do not
          # exist here, and a drill that fails on role names has told you
          # nothing about whether the data survived.
          "$PG_BIN/pg_restore" \
            --dbname "$SCRATCH_URL" \
            --no-owner \
            --no-privileges \
            --exit-on-error \
            --jobs 4 \
            "${{ steps.fetch.outputs.dump }}"

      - name: Count every table, here and in production
        id: counts
        run: |
          set -euo pipefail
          cat > count.sql <<'SQL'
          SELECT table_name,
                 (xpath('/row/cnt/text()', xml_count))[1]::text::bigint AS rows
          FROM (
            SELECT table_name, table_schema,
                   query_to_xml(format('SELECT count(*) AS cnt FROM %I.%I', table_schema, table_name),
                                false, true, '') AS xml_count
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
          ) counted
          ORDER BY table_name;
          SQL

          "$PG_BIN/psql" "$SCRATCH_URL" -At -F',' -f count.sql > restored.csv
          # Read-only against production: this is a COUNT, nothing else.
          "$PG_BIN/psql" "${{ secrets.DIRECT_DATABASE_URL }}" -At -F',' -f count.sql > live.csv

          wc -l restored.csv live.csv

      - name: Compare
        id: compare
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee compare.txt
          import json, sys

          # This drill answers ONE question: does the newest backup restore into
          # a complete, internally-consistent database? It is NOT a freshness
          # check on the data (the backup is hours old by design, and on a heavy
          # migration day the schema itself will have moved on). Freshness is the
          # >48h check in the Fetch step. So: hard-fail only on a truncated or
          # corrupt restore or missing core data; everything age-related is a note.

          CORE = ('User', 'Student', 'Payment', 'Grade', 'Attendance')

          def read(path):
              out = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line or ',' not in line:
                          continue
                      name, count = line.rsplit(',', 1)
                      out[name] = int(count)
              return out

          live = read('live.csv')
          restored = read('restored.csv')
          problems, notes = [], []

          # 1. Core tables must be present and substantially intact in the restore.
          for t in CORE:
              lr, rr = live.get(t, 0), restored.get(t, 0)
              if lr == 0:
                  continue
              if rr == 0:
                  problems.append(f"{t} is EMPTY in the restore (live has {lr})")
              elif rr < lr * 0.5:
                  problems.append(f"{t}: only {rr} restored vs {lr} live — >50% short")
              elif rr < lr * 0.9:
                  notes.append(f"{t}: {rr} restored vs {lr} live (backup is older)")

          # 2. The restore must be substantial, not a dump that stopped early.
          rtot, ltot = sum(restored.values()), sum(live.values())
          rtables = sum(1 for v in restored.values() if v > 0)
          if rtables < 20:
              problems.append(f"only {rtables} tables carry data in the restore")
          if ltot > 0 and rtot < ltot * 0.5:
              problems.append(f"restore holds {rtot} rows vs {ltot} live — >50% short overall")

          # 3. Tables in live but not the restore: expected when the backup
          #    predates recent migrations. A note, never a failure here.
          drift = sorted(set(live) - set(restored))
          if drift:
              notes.append("tables added since this backup: " + ", ".join(drift))

          # 4. Non-core row shortfalls: informational.
          for t, lr in sorted(live.items()):
              if t in CORE or t == '_prisma_migrations':
                  continue
              rr = restored.get(t, 0)
              if lr > 20 and rr < lr * 0.5:
                  notes.append(f"{t}: {rr} restored vs {lr} live")

          print(f"restored {rtot} rows across {rtables} populated tables (live: {ltot})")
          for n in notes:
              print(f"  note: {n}")

          detail = {"tables": rtables, "rows": rtot, "problems": problems, "notes": notes}
          with open('detail.json', 'w') as fh:
              json.dump(detail, fh)

          if problems:
              print("DRILL FAILED:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("Drill passed: the newest backup restores to a complete, consistent database.")
          PY

      - name: Tell the app
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${{ secrets.APP_BASE_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "APP_BASE_URL/CRON_SECRET not set — skipping the check-in."
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            DETAIL="$(cat detail.json 2>/dev/null || echo '{}')"
            PAYLOAD=$(printf '{"kind":"drill","status":"success","snapshotId":"%s","detail":%s}' \
              "${{ steps.fetch.outputs.snapshot_id }}" "$DETAIL")
          else
            PAYLOAD=$(printf '{"kind":"drill","status":"failed","error":"Restore drill failed in run %s — the newest backup did NOT restore cleanly. See the Actions log."}' \
              "${{ github.run_id }}")
          fi

          curl -fsS -X POST "${{ secrets.APP_BASE_URL }}/api/backup/report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "::warning::Could not reach the app to record this run."
